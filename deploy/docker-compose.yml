services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/static/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/static:/etc/traefik/static:ro
      - ./traefik/dynamic/active:/etc/traefik/dynamic/active
      - ./traefik/dynamic/staging:/etc/traefik/dynamic/staging
      - ./traefik/acme:/etc/traefik/acme
    networks:
      - edge
      - control

  control-api:
    build:
      context: ../../traefik-control-plane-api
    image: traefik-control-plane-api:dev
    container_name: control-api
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://control:${POSTGRES_PASSWORD}@postgres:5432/traefik_control
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - PUBLIC_BASE_URL=https://traefik-admin.${BASE_DOMAIN}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}
      - LOCAL_AUTH_ENABLED=${LOCAL_AUTH_ENABLED}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME}
      - INITIAL_ADMIN_PASSWORD_HASH=${INITIAL_ADMIN_PASSWORD_HASH}
      - AGENT_URL=http://apply-agent:7000
      - AGENT_SHARED_TOKEN=${AGENT_SHARED_TOKEN}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_ROOT_PATH=/api
      - CORS_ALLOWED_ORIGINS=https://traefik-admin.${BASE_DOMAIN}
      - CONFIG_REPO_PATH=${CONFIG_REPO_PATH:-}
      - CONFIG_REPO_AUTHOR_NAME=${CONFIG_REPO_AUTHOR_NAME:-traefik-control-plane}
      - CONFIG_REPO_AUTHOR_EMAIL=${CONFIG_REPO_AUTHOR_EMAIL:-control-plane@local}
      - CLOUDFLARE_API_TOKEN=${CF_DNS_API_TOKEN}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - POWERDNS_API_URL=${POWERDNS_API_URL:-}
      - POWERDNS_API_KEY=${POWERDNS_API_KEY:-}
    volumes:
      - ../../traefik-control-plane-config:/srv/config-repo:rw
    labels:
      - traefik.enable=true
      - traefik.http.routers.control-api.rule=Host(`traefik-admin.${BASE_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.control-api.entrypoints=websecure
      - traefik.http.routers.control-api.tls=true
      - traefik.http.routers.control-api.tls.certresolver=le_cf
      - traefik.http.routers.control-api.middlewares=control-api-stripprefix
      - traefik.http.middlewares.control-api-stripprefix.stripprefix.prefixes=/api
      - traefik.http.services.control-api.loadbalancer.server.port=8000
    depends_on:
      - postgres
      - redis
      - apply-agent
    networks:
      - edge
      - control

  control-ui:
    build:
      context: ../../traefik-control-plane-ui
    image: traefik-control-plane-ui:dev
    container_name: control-ui
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.control-ui.rule=Host(`traefik-admin.${BASE_DOMAIN}`)
      - traefik.http.routers.control-ui.entrypoints=websecure
      - traefik.http.routers.control-ui.tls=true
      - traefik.http.routers.control-ui.tls.certresolver=le_cf
      - traefik.http.services.control-ui.loadbalancer.server.port=3000
    depends_on:
      - control-api
    networks:
      - edge

  apply-agent:
    build:
      context: ../../traefik-control-plane-agent
    image: traefik-control-plane-agent:dev
    container_name: apply-agent
    restart: unless-stopped
    environment:
      - AGENT_SHARED_TOKEN=${AGENT_SHARED_TOKEN}
      - TRAEFIK_DYNAMIC_STAGING_DIR=/etc/traefik/dynamic/staging
      - TRAEFIK_DYNAMIC_ACTIVE_DIR=/etc/traefik/dynamic/active
    volumes:
      - ./traefik/dynamic/active:/etc/traefik/dynamic/active
      - ./traefik/dynamic/staging:/etc/traefik/dynamic/staging
    networks:
      - control

  postgres:
    image: postgres:16
    container_name: control-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=traefik_control
      - POSTGRES_USER=control
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - control

  redis:
    image: redis:7-alpine
    container_name: control-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - control

volumes:
  postgres_data:
  redis_data:

networks:
  edge:
  control:
